  .req li.ok { color:var(--ok); } .req li.bad { color:var(--bad); }
  .bar { height:5px; border-radius:3px; background:#eceef4; margin-top:7px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:#3b6fd4; }
  .bar.ok > i { background:#2f9e5c; }
  .manual { display:flex; align-items:center; gap:8px; padding:9px 14px; border-bottom:1px solid #f1f2f6; font-size:12.5px; }

m":"446","group":"AEL","credits":3,"ects":6,"season":"Fall","faculty_course":false,"mandatory":false,"prereq":{"args":["SPS 101","SPS 102"],"op":"and"},"prereq_text":"(SPS101 AND SPS102)"},{"code":"POLS457","name":"The Politics of Authoritarian Regimes","subject":"POLS","num":"457","group":"AEL","credits":3,"ects":6,"season":"Spring","faculty_course":false,"mandatory":false,"prereq":"POLS 250","prereq_text":"POLS250"},{"code":"SOC301","name":"Political Sociology","subject":"SOC","num":"301","group":"AEL","credits":3,"ects":6,"season":"Not offered recently","faculty_course":true,"mandatory":false,"prereq":{"args":["SPS 101","SPS 102"],"op":"and"},"prereq_text":"(SPS101 AND SPS102)"},{"code":"SOC408","name":"Religion and Politics","subject":"SOC","num":"408","group":"AEL","credits":3,"ects":6,"season":"Fall","faculty_course":false,"mandatory":false,"prereq":null,"prereq_text":"NONE"},{"code":"SOC420","name":"Infrastructure and Mobilities","subject":"SOC","num":"420","group":"AEL","credits":3,"ects":6,"season":"Spring","faculty_course":false,"mandatory":false,"prereq":null,"prereq_text":"NONE"},{"code":"SOC425","name":"Power, Economy, and Society","subject":"SOC","num":"425","group":"AEL","credits":3,"ects":6,"season":"Spring","faculty_course":false,"mandatory":false,"prereq":"SOC 201","prereq_text":"SOC201"},{"code":"SPS374","name":"Global Environmental Challenges","subject":"SPS","num":"374","group":"AEL","credits":3,"ects":6,"season":"Fall","faculty_course":false,"mandatory":false,"prereq":null,"prereq_text":"NONE"},{"code":"SPS384","name":"Climate Change and Environmental Politics","subject":"SPS","num":"384","group":"AEL","credits":3,"ects":6,"season":"Spring","faculty_course":false,"mandatory":false,"prereq":null,"prereq_text":"NONE"},{"code":"SPS394","name":"Political Ecology and Society","subject":"SPS","num":"394","group":"AEL","credits":3,"ects":6,"season":"Not offered recently","faculty_course":false,"mandatory":false,"prereq":null,"prereq_text":"NONE"},{"code":"SPS404","name":"Six Key Global Challenges: A Historical Perspective","subject":"SPS","num":"404","group":"AEL","credits":3,"ects":6,"season":"Spring","faculty_course":false,"mandatory":false,"prereq":null,"prereq_text":"NONE"},{"code":"PROJ102","name":"Project Course","subject":"PROJ","num":"102","group":"OTHER","credits":3,"ects":2,"season":"Not offered recently","faculty_course":false,"mandatory":false,"prereq":null,"prereq_text":"NONE"},{"code":"ECON201","name":"Games and Strategies","subject":"ECON","num":"201","group":"OTHER","credits":3,"ects":6,"season":"Fall & Spring","faculty_course":false,"mandatory":false,"prereq":null,"prereq_text":"NONE"},{"code":"ECON204","name":"Microeconomics","subject":"ECON","num":"204","group":"OTHER","credits":3,"ects":6,"season":"Fall & Spring","faculty_course":false,"mandatory":false,"prereq":null,"prereq_text":"NONE"}]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const BY_CODE = Object.fromEntries(D.courses.map(c => [c.code, c]));
const taken = new Set();
const manual = { free: 0, fcExtra: 0 };

// Faculty-course areas: SSBF's six areas plus MDBF and YBF.
const AREA = {
  CULT:'CULT', ECON:'ECON', HART:'HART', VA:'VA', PSYCH:'PSYCH',
  POLS:'SPS/POLS/IR', IR:'SPS/POLS/IR', CONF:'SPS/POLS/IR', SPS:'SPS/POLS/IR',
  PSIR:'SPS/POLS/IR', SOC:'SPS/POLS/IR', LAW:'SPS/POLS/IR', PHIL:'SPS/POLS/IR',
  HIST:'HART', MATH:'MDBF', NS:'MDBF', IF:'MDBF', CS:'MDBF', ENS:'MDBF',
  PHYS:'MDBF', BIO:'MDBF', DSA:'MDBF', EE:'MDBF', ME:'MDBF', PROJ:'MDBF',
};
const SSBF_AREAS = ['CULT','ECON','HART','PSYCH','SPS/POLS/IR','VA'];

const sum = (list, key) => list.reduce((s, c) => s + (c[key] || 0), 0);
const inGroup = key => D.courses.filter(c => c.group === key);
const takenIn = key => inGroup(key).filter(c => taken.has(c.code));

function satisfied(expr) {
  if (!expr) return true;
  if (typeof expr === 'string') return taken.has(expr.replace(/\s+/g, ''));
  return expr.op === 'and' ? expr.args.every(satisfied) : expr.args.some(satisfied);
}

function evaluate() {
  const reqs = [];
  const add = (title, sub) => {
    reqs.push({ title, sub, ok: sub.every(s => s.ok) });
  };

  // --- Required courses
  const req = takenIn('REQ');
  const reqMissing = inGroup('REQ').filter(c => !taken.has(c.code));
  add('Required Courses', [
    { label: `all 9 mandatory courses taken (${9 - reqMissing.length}/9)`, ok: !reqMissing.length },
    { label: `${sum(req, 'credits')}/24 SU credits`, ok: sum(req, 'credits') >= 24 },
  ]);

  // --- Core electives + area electives
  for (const g of D.groups.filter(g => ['C1', 'C2', 'AEL'].includes(g.key))) {
    const list = takenIn(g.key);
    const credits = sum(list, 'credits');
    add(g.title, [
      { label: `${credits}/${g.min_credits} SU credits`, ok: credits >= g.min_credits },
    ]);
  }

  // --- University courses
  const uc = takenIn('UC');
  const ucCredits = sum(uc, 'credits');
  const hum = uc.filter(c => c.subject === 'HUM');
  const hum2 = hum.filter(c => c.num.startsWith('2')).length;
  const hum3 = hum.filter(c => c.num.startsWith('3')).length;
  const missingMandatory = inGroup('UC').filter(c => c.mandatory && !taken.has(c.code));
  add('University Courses', [
    { label: `${uc.length}/17 courses`, ok: uc.length >= 17 },
    { label: `${ucCredits}/44 SU credits`, ok: ucCredits >= 44 },
    { label: `every 1XX course, PROJ 201 and SPS 303 taken (${missingMandatory.length} missing)`, ok: !missingMandatory.length },
    { label: `two HUM courses, one 2xx then one 3xx (${hum2} 2xx, ${hum3} 3xx)`, ok: hum2 >= 1 && hum3 >= 1 && hum.length >= 2 },
  ]);

  // --- Free electives (open pool)
  const freeFromOther = sum(takenIn('OTHER'), 'credits');
  const free = manual.free + freeFromOther;
  add('Free Electives', [
    { label: `${free}/18 SU credits (${freeFromOther} from listed extras, ~${manual.free * 2} ECTS entered)`,
      ok: free >= 18 },
  ]);

  // --- Faculty courses
  const all = D.courses.filter(c => taken.has(c.code));
  const areas = new Set();
  let ssbf = 0;
  for (const c of all) {
    const area = AREA[c.subject];
    if (!area) continue;
    areas.add(area);
    if (SSBF_AREAS.includes(area)) ssbf += 1;
  }
  const fcTotal = all.filter(c => AREA[c.subject]).length + manual.fcExtra;
  add('Faculty Courses (estimated)', [
    { label: `${fcTotal}/5 courses from faculty pools`, ok: fcTotal >= 5 },
    { label: `${ssbf}/3 from SSBF areas`, ok: ssbf >= 3 },
    { label: `${areas.size}/3 distinct areas (${[...areas].join(', ') || 'none'})`, ok: areas.size >= 3 },
  ]);

  // --- Totals
  const totalCredits = sum(all, 'credits') + manual.free;
  // free electives are entered as SU credits only; Sabanci runs about 2 ECTS per SU credit
  const totalEcts = sum(all, 'ects') + manual.free * 2;
  add('Degree totals', [
    { label: `${totalCredits}/125 SU credits`, ok: totalCredits >= 125 },
    { label: `${totalEcts}/240 ECTS`, ok: totalEcts >= 240 },
  ]);

  // --- Prerequisites
  const issues = [];
  for (const c of all) {
    if (c.prereq && !satisfied(c.prereq)) {
      issues.push({ code: c.code, name: c.name, needs: c.prereq_text });
      continue;
    }
    for (const dep of exprCodes(c.prereq)) {
      if (!BY_CODE[dep] && !taken.has(dep)) {
        issues.push({ code: c.code, name: c.name, needs: dep, outside: true });
        break;
      }
    }
  }
  return { reqs, issues, totalCredits, totalEcts, takenCount: all.length };
}

function exprCodes(expr) {
  if (!expr) return [];
  if (typeof expr === 'string') return [expr.replace(/\s+/g, '')];
  return expr.args.flatMap(exprCodes);
}

// ---------------------------------------------------------------- rendering
const CHIP = { 'Fall':'Fall', 'Spring':'Spring', 'Fall & Spring':'Both', 'Not offered recently':'Stale' };

function render() {
  if (!document.getElementById('checklist')) return;
  const filter = document.getElementById('filter').value.trim().toLowerCase();

  document.getElementById('checklist').innerHTML = D.groups.map(g => {
    const items = inGroup(g.key).filter(c =>
      !filter || c.code.toLowerCase().includes(filter) || c.name.toLowerCase().includes(filter));
    if (!items.length) return '';
    const credits = sum(items.filter(c => taken.has(c.code)), 'credits');
    const head = g.min_credits
      ? `${items.filter(c => taken.has(c.code)).length} of ${items.length} taken · ${credits}/${g.min_credits} SU credits`
      : `${items.filter(c => taken.has(c.code)).length} of ${items.length} taken`;
    return `<div class="card">
      <h2>${g.title} <small>${g.tr ? g.tr + ' · ' : ''}${head}</small></h2>
      <div class="rule">${g.rule}</div>
      ${items.map(c => `
        <label class="row${taken.has(c.code) ? ' done' : ''}">
          <input type="checkbox" data-code="${c.code}" ${taken.has(c.code) ? 'checked' : ''} />
          <span class="code">${c.code.replace(/([A-Z]+)(\d)/, '$1 $2')}</span>
          <span class="name" title="${c.name}">${c.name}${c.mandatory ? ' <b title="mandatory">*</b>' : ''}</span>
          <span class="meta">
            <span class="chip ${CHIP[c.season] || ''}">${c.season === 'Not offered recently' ? 'not recent' : c.season}</span>
            <span>${c.credits} SU · ${c.ects} ECTS</span>
          </span>
        </label>`).join('')}
    </div>`;
  }).join('');

  const { reqs, issues, totalCredits, totalEcts, takenCount } = evaluate();
  document.getElementById('requirements').innerHTML = reqs.map(r => `
    <div class="req">
      <div class="head"><span>${r.title}</span>
        <span class="state ${r.ok ? 'ok' : 'bad'}">${r.ok ? 'met' : 'missing'}</span></div>
      <ul>${r.sub.map(s => `<li class="${s.ok ? 'ok' : 'bad'}">${s.ok ? '✓' : '✗'} ${s.label}</li>`).join('')}</ul>
    </div>`).join('');

  const bad = reqs.filter(r => !r.ok);
  const badge = document.getElementById('badge');
  badge.className = 'badge ' + (bad.length ? 'bad' : 'ok');
  badge.textContent = bad.length
    ? `Not yet — ${bad.length} requirement${bad.length > 1 ? 's' : ''} unmet`
    : 'All graduation requirements met';
  document.getElementById('stats').textContent =
    `${takenCount} courses ticked · ${totalCredits} SU credits · ${totalEcts} ECTS`;

  document.getElementById('issues').innerHTML = issues.length
    ? issues.map(i => `<li><b>${i.code.replace(/([A-Z]+)(\d)/, '$1 $2')}</b> needs ${i.needs}${i.outside ? ' (not in this list)' : ''}</li>`).join('')
    : '<li class="none">No prerequisite problems.</li>';
}

function init() {
  if (!document.getElementById('checklist')) return;
  try {
    const saved = JSON.parse(localStorage.getItem('bapsir-check') || '{}');
    (saved.taken || []).forEach(c => BY_CODE[c] && taken.add(c));
    manual.free = saved.free || 0;
    manual.fcExtra = saved.fcExtra || 0;
    document.getElementById('free').value = manual.free;
    document.getElementById('fcextra').value = manual.fcExtra;
  } catch (e) { /* first visit */ }

  const save = () => {
    try {
      localStorage.setItem('bapsir-check', JSON.stringify({
        taken: [...taken], free: manual.free, fcExtra: manual.fcExtra,
      }));
    } catch (e) { /* ignore */ }
  };

  document.addEventListener('change', ev => {
    const box = ev.target.closest('input[type=checkbox]');
    if (box) {
      box.dataset.code && (box.checked ? taken.add(box.dataset.code) : taken.delete(box.dataset.code));
      save(); render();
    }
    if (ev.target.id === 'free' || ev.target.id === 'fcextra') {
      manual[ev.target.id === 'free' ? 'free' : 'fcExtra'] = Number(ev.target.value) || 0;
      save(); render();
    }
  });
  document.getElementById('filter').addEventListener('input', render);
  document.getElementById('clear').addEventListener('click', () => {
    taken.clear(); manual.free = 0; manual.fcExtra = 0;
    document.getElementById('free').value = 0;
    document.getElementById('fcextra').value = 0;
    save(); render();
  });
  render();
}
init();
</script>
